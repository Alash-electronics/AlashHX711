sentence=Easy HX711 load cell library: tare, calibration with a known weight, weight in grams, stable reading detection. No dependencies.
paragraph=Builds digital scales from a load cell and the HX711 module: tare(), calibrate(500) with a known weight, weight() in grams, average without outliers, a stable-reading check, and clear messages in Russian, Kazakh or English when the module does not answer, the signal saturates or the scale factor is missing. Works on Arduino AVR, ESP32, ESP8266 with any two digital pins. Examples included, made for classes and kits by Alash Electronics.
